[package]
name = "token-bi"
version = "1.2.6"
description = "Token BI desktop app shell"
authors = ["gbs00"]
edition = "2021"

[profile.release]
strip = "symbols"

[lib]
name = "token_bi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tempfile = "3.20"
sha2 = "0.10"
tokio = { version = "1", features = ["time"] }
tauri = { version = "~2.10.3", features = ["tray-icon", "image-png"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "blocking"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.10.1"

[dev-dependencies]
tauri = { version = "~2.10.3", features = ["test"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSGeometry"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWindow", "NSScreen", "NSView", "NSColor", "NSStatusItem", "NSStatusBarButton", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CALayer", "objc2-core-foundation"] }
