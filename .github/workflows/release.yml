name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos-release:
    name: Verify and stage signed Apple Silicon release
    runs-on: macos-15
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Check signing configuration and architecture
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test "$(uname -m)" = arm64
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/playwright install chromium webkit
          npm ci
      - name: Verify and build signed artifacts
        run: ./scripts/release_local.sh
      - name: Create complete draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Token BI $GITHUB_REF_NAME" --notes-file "docs/RELEASE_NOTES_$GITHUB_REF_NAME.md" dist/release-"$GITHUB_REF_NAME"/*
      # Publish only after reviewing all assets. A draft is not the updater's latest release.
