name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: macos-15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure isolated application data
        run: printf 'TOKEN_BI_APP_DATA_DIR=%s/token-bi-checks\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install development dependencies
        run: |
          test "$(uname -m)" = arm64
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          .venv/bin/python -m playwright install chromium webkit
          .venv/bin/python -m pip check
          npm ci
      - name: Prepare isolated test components
        run: |
          npm run app:sidecar
          .venv/bin/python scripts/build_wkwebview_probe.py
          npm run desktop:assets
      - name: Python and browser regression
        env:
          TOKEN_BI_NATIVE_WK_TEST: "1"
        run: .venv/bin/python -m pytest -q -p no:cacheprovider
      - name: JavaScript regression
        run: npm run desktop:test
      - name: Rust regression and static checks
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --locked --manifest-path src-tauri/Cargo.toml --target-dir src-tauri/target.noindex --lib
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --target-dir src-tauri/target.noindex --all-targets -- -D warnings
