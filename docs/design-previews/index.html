<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Token BI 设计预览索引</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0c0f;
        --panel: #13171d;
        --line: #293340;
        --text: #eef3f8;
        --muted: #8b98a9;
        --cyan: #22d3ee;
        --green: #4ade80;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 28px;
      }

      main {
        width: min(960px, 100%);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }

      p {
        margin-top: 0;
        color: var(--muted);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        margin-top: 22px;
      }

      a {
        display: block;
        min-height: 180px;
        padding: 18px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
        text-decoration: none;
      }

      a:hover {
        border-color: var(--cyan);
      }

      strong {
        display: block;
        margin-bottom: 10px;
        font-size: 18px;
      }

      span {
        color: var(--muted);
        line-height: 1.6;
      }

      em {
        display: inline-block;
        margin-top: 18px;
        color: var(--green);
        font-style: normal;
        font-size: 13px;
      }

      @media (max-width: 760px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Token BI 夜间模式设计预览</h1>
      <p>这组文件只用于视觉方案确认，不接入现有 Token BI 运行代码。</p>
      <section class="grid">
        <a href="./preview-a-command-center.html">
          <strong>A · Integrated Console</strong>
          <span>Tauri 控制台不拆分，在同一工作台里承载用户操作和服务状态。</span>
          <em>推荐作为控制台主方向</em>
        </a>
        <a href="./preview-b-focus-dashboard.html">
          <strong>B · Equal Quotas</strong>
          <span>BI 看板只展示同级官方额度窗口，不放推断指标、链路或日志等服务信息。</span>
          <em>推荐作为看板主方向</em>
        </a>
        <a href="./preview-c-ops-monitor.html">
          <strong>C · Ops Monitor</strong>
          <span>上一版的独立服务监控思路，当前不作为推荐方向，只保留用于对照。</span>
          <em>暂不采用</em>
        </a>
      </section>
    </main>
  </body>
</html>
