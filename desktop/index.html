<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Token BI</title>
    <style>
      :root {
        color: #f4f7ff;
        background: #101625;
        font-family: "Avenir Next", "SF Pro Display", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(102, 215, 239, 0.18), transparent 38%),
          linear-gradient(180deg, #0d1425 0%, #11131c 100%);
      }

      .card {
        width: min(420px, calc(100vw - 48px));
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 24px;
        padding: 28px;
        background: rgba(24, 30, 45, 0.92);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 32px;
      }

      p {
        margin: 0;
        color: #aab5ca;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <section class="card">
      <h1>Token BI</h1>
      <p>控制台入口由 Token BI App 自动打开。若你看到此页面，请重新打开 App 或查看运行日志。</p>
    </section>
  </body>
</html>
