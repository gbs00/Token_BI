<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Token BI</title>
  <link rel="stylesheet" href="./panel.css">
  <script type="module" src="./panel.mjs"></script>
</head>
<body>
  <main class="panel">
    <header class="brand" id="brand"><img src="./assets/icon.png" width="52" height="52" alt=""><h1>Token BI</h1></header>
    <header class="subhead" id="subhead" hidden>
      <button class="icon-button" data-action="back" title="返回额度" aria-label="返回额度"><img src="./assets/chevron-left.svg" alt=""></button>
      <h1 id="view-title">连接副屏</h1>
    </header>
    <div class="scroll-body">
      <section id="home" aria-label="账号额度">
        <div class="account" id="account" hidden>
          <div class="account-row"><strong id="email"></strong><button class="text-button" data-action="logout">退出账号</button></div>
          <p class="secondary" id="source"></p>
        </div>
        <div class="notice" id="notice" role="status" hidden><img src="./assets/triangle-alert.svg" alt=""><p id="notice-text"></p><button class="text-button" data-action="retry">重试</button></div>
        <div id="metrics" class="metrics"></div>
        <section class="reset-credits" id="reset-credits" aria-label="存储重置" hidden>
          <h2>存储重置</h2>
          <div class="reset-expirations" id="reset-expirations"><img src="./assets/clock-3.svg" alt="" aria-hidden="true"><div id="reset-credits-times" role="list" aria-label="各次重置到期剩余时间"></div></div>
          <p id="reset-credits-empty" hidden>暂无可用重置</p>
        </section>
        <div class="empty" id="empty">
          <span class="user-symbol"><img src="./assets/user-round.svg" width="40" height="40" alt=""></span>
          <h2 id="empty-title">正在连接本地服务</h2><p id="empty-copy" class="secondary"></p>
          <button class="primary" data-action="login" id="login" hidden>登录账号</button>
        </div>
        <div class="home-actions">
          <button class="primary" data-action="qr"><img src="./assets/qr-code.svg" alt="">扫码连接副屏</button>
          <button class="secondary-button" data-action="open_local"><img src="./assets/external-link.svg" alt="">打开看板</button>
        </div>
      </section>
      <section id="qr" class="qr-view" aria-label="连接副屏" hidden>
        <div class="segments" role="group" aria-label="连接入口">
          <button data-kind="lan" aria-pressed="true">局域网</button><button data-kind="fixed" aria-pressed="false">固定入口</button>
        </div>
        <div class="qr-area"><img id="qr-image" alt="副屏看板连接二维码" hidden><p class="secondary" id="qr-status" role="status"></p></div>
        <p class="connection-note" id="connection-note">副屏与 Mac 需连接同一局域网。</p>
        <div class="url-row"><span id="qr-url"></span><button class="icon-button" data-action="copy" title="复制链接" aria-label="复制链接"><img src="./assets/copy.svg" alt=""></button></div>
        <button class="secondary-button" data-action="copy"><img src="./assets/copy.svg" alt="">复制链接</button>
        <button class="primary" data-action="open_selected"><img src="./assets/external-link.svg" alt="">打开看板</button>
      </section>
      <section id="settings" class="settings-view" aria-label="设置" hidden>
        <button class="setting-row" data-action="diagnostics"><span>诊断信息</span><img src="./assets/file-text.svg" alt=""></button>
        <div class="software-update">
          <div class="update-heading"><h2>Token BI 软件更新</h2><span id="current-version"></span></div>
          <div class="update-status" role="status" aria-live="polite"><span class="update-symbol" id="update-symbol"><img id="update-icon" src="./assets/refresh-cw.svg" alt=""></span><div><h3 id="update-title">检查应用更新</h3><p id="update-description"></p></div></div>
          <div id="release-notes" hidden><div class="release-heading"><span id="release-version"></span><button class="text-button" id="toggle-notes" aria-expanded="false" aria-controls="notes-copy">展开</button></div><pre id="notes-copy" hidden></pre></div>
          <div class="download-progress" id="download-progress" hidden><progress id="progress" max="100" aria-label="更新下载进度"></progress><p id="progress-label"></p></div>
          <p class="restart-note" id="restart-note" hidden>重启时副屏会短暂断连，随后自动恢复。</p>
          <button class="primary update-action" id="update-action"><img src="./assets/refresh-cw.svg" alt=""><span>检查更新</span></button>
          <button class="text-button update-later" id="update-later" hidden>稍后再说</button>
        </div>
      </section>
      <section id="diagnostics" class="diagnostics-view" aria-label="诊断信息" hidden>
        <dl><dt>本地服务</dt><dd id="diag-health"></dd><dt>最近成功同步</dt><dd id="diag-success"></dd><dt>最近同步结果</dt><dd id="diag-state"></dd></dl>
        <h2>最近日志</h2><pre id="log"></pre>
      </section>
    </div>
    <p id="feedback" class="feedback" role="status" hidden></p>
    <footer>
      <button data-action="refresh"><img src="./assets/refresh-cw.svg" alt=""><span id="refresh-label">刷新</span></button>
      <button data-action="settings" id="settings-button" aria-label="设置"><span class="settings-icon"><img src="./assets/settings.svg" alt=""><span class="update-dot" id="update-dot" hidden></span></span>设置</button>
      <button data-action="quit"><img src="./assets/power.svg" alt="">退出</button>
    </footer>
    <dialog id="confirm-dialog" aria-labelledby="confirm-title"><h2 id="confirm-title"></h2><p id="confirm-copy"></p><div class="dialog-actions"><button data-action="cancel" class="secondary-button">取消</button><button id="confirm-button" class="primary">确认</button></div></dialog>
  </main>
</body>
</html>
