<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Token BI 启动失败</title>
    <style>
      :root {
        color: #f4f7ff;
        background: #0c111b;
        font-family: "Avenir Next", "SF Pro Display", "PingFang SC", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 18% 0%, rgba(64, 118, 236, 0.22), transparent 30%),
          linear-gradient(180deg, #0b111b 0%, #101721 100%);
      }

      main {
        width: min(440px, calc(100vw - 48px));
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 18px;
        padding: 28px;
        background: rgba(17, 24, 36, 0.94);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.36);
      }

      .eyebrow {
        margin: 0 0 14px;
        color: #ffcc66;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0;
      }

      h1 {
        margin: 0 0 14px;
        color: #f6f8ff;
        font-size: 28px;
        line-height: 1.12;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #b8c4d9;
        font-size: 15px;
        line-height: 1.68;
        letter-spacing: 0;
      }

      .reason {
        margin-top: 18px;
        padding: 14px 16px;
        border: 1px solid rgba(255, 204, 102, 0.26);
        border-radius: 12px;
        color: #dce6f7;
        background: rgba(255, 204, 102, 0.08);
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">启动异常</p>
      <h1 id="title">Token BI 启动失败</h1>
      <p>控制台没有成功打开。请根据下面的原因处理后重新打开 App。</p>
      <p id="detail" class="reason">未收到具体错误原因。</p>
    </main>
    <script>
      const error = window.__TOKEN_BI_STARTUP_ERROR__ || {};
      document.getElementById("title").textContent = error.title || "Token BI 启动失败";
      document.getElementById("detail").textContent = error.detail || "未收到具体错误原因。";
    </script>
  </body>
</html>
